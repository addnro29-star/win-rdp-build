name: Free Windows RDP for Build (Win11-like)

on:
  workflow_dispatch:   # Chạy thủ công khi bạn cần

jobs:
  rdp:
    runs-on: windows-latest          # Windows Server 2025 (gần giống Win11, tương thích build tốt)
    timeout-minutes: 360             # Chạy tối đa 6 giờ

    steps:
      - name: Enable RDP & Set Password
        shell: powershell
        run: |
          Write-Host "=== Bật Remote Desktop ==="
          
          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Đặt password cho user runneradmin
          $password = ConvertTo-SecureString "HanBuild2026" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
          
          Write-Host "Username: runneradmin"
          Write-Host "Password: HanBuild2026"
          Write-Host "RDP đã bật thành công!"

      - name: Download & Run ngrok v3 (Fix ERR_NGROK_121)
        shell: powershell
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Write-Host "=== Tải ngrok phiên bản mới nhất (v3) ==="
          
          # Link tải ngrok v3 ổn định hiện tại
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          
          Expand-Archive "ngrok.zip" -DestinationPath "ngrok" -Force
          cd ngrok
          
          # Đăng nhập ngrok v3
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH
          
          Write-Host "Ngrok v3 đã tải và đăng nhập thành công!"
          
          # Chạy tunnel cho RDP (port 3389)
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -PassThru
          
          Write-Host "=== Đang tạo tunnel ngrok... ==="
          Write-Host "Chờ khoảng 20-40 giây để tunnel ổn định."
          Write-Host "Sau đó xem log bên dưới để tìm dòng chứa:"
          Write-Host "tcp://0.tcp.ngrok.io:XXXXX   <-- Đây là địa chỉ RDP của bạn"
          
          # Chờ để tunnel khởi tạo và in log rõ ràng
          Start-Sleep -Seconds 40

      - name: Show Final RDP Info
        shell: powershell
        run: |
          Write-Host "=================================================="
          Write-Host "                 THÔNG TIN RDP"
          Write-Host "=================================================="
          Write-Host "Username : runneradmin"
          Write-Host "Password : HanBuild2026"
          Write-Host "=================================================="
          Write-Host "Hướng dẫn kết nối:"
          Write-Host "1. Mở Remote Desktop (mstsc) trên máy bạn"
          Write-Host "2. Nhập địa chỉ RDP lấy từ log bước trên (dạng 0.tcp.ngrok.io:XXXXX)"
          Write-Host "3. Nhập username và password ở trên"
          Write-Host "=================================================="
          Write-Host "Máy sẽ tự tắt sau tối đa 6 giờ. Build xong thì để nó chạy hoặc Re-run sau."
